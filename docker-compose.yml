services:
  db:
    image: postgres:16-alpine
    container_name: restaurant-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-restaurant_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: restaurant-backend
    restart: unless-stopped

    environment:
      PROJECT_NAME: "Restaurant Management System"

      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-restaurant_db}"

      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:5173,http://127.0.0.1:5173}
      QR_FRONTEND_URL: ${QR_FRONTEND_URL:-http://localhost:5173}

      SEED_DEMO_ACCOUNT: ${SEED_DEMO_ACCOUNT:-true}
      DEMO_USERNAME: ${DEMO_USERNAME:-manager}
      DEMO_PHONE: ${DEMO_PHONE:-0963217400}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
      DEMO_FULL_NAME: ${DEMO_FULL_NAME:-Quản lý nhà hàng}

      DB_MIGRATION_RETRIES: ${DB_MIGRATION_RETRIES:-12}
      DB_MIGRATION_RETRY_DELAY: ${DB_MIGRATION_RETRY_DELAY:-2}

      # Customer booking lookup/cancellation.
      # Defaults use the local Mailpit demo service so teammates
      # can test cancellation emails without personal SMTP credentials.
      RESTAURANT_PHONE: ${RESTAURANT_PHONE:-0963217400}
      RESTAURANT_ADDRESS: ${RESTAURANT_ADDRESS:-Địa chỉ nhà hàng chưa được cấu hình}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-10}
      NOTIFICATION_RETRY_MINUTES: ${NOTIFICATION_RETRY_MINUTES:-5}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@restaurant.local}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}

    ports:
      - "8000:8000"

    volumes:
      - uploads_data:/app/uploads
      - ./backend/uploads:/app/upload

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    container_name: restaurant-mailpit
    restart: unless-stopped

    environment:
      # Mailpit Web UI
      MP_UI_BIND_ADDR: "0.0.0.0:8025"

      # Mailpit SMTP server nhận email từ backend
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"

      # ============================================================
      # SMTP RELAY
      # Mailpit sẽ tự động gửi email ra SMTP thật
      # đến đúng địa chỉ nằm trong trường To:
      # ============================================================
      MP_SMTP_RELAY_HOST: "smtp.gmail.com"
      MP_SMTP_RELAY_PORT: "587"
      MP_SMTP_RELAY_STARTTLS: "true"
      MP_SMTP_RELAY_TLS: "false"
      MP_SMTP_RELAY_AUTH: "plain"

      # TÀI KHOẢN GMAIL DÙNG ĐỂ GỬI
      MP_SMTP_RELAY_USERNAME: "${SMTP_RELAY_USERNAME:-}"
      MP_SMTP_RELAY_PASSWORD: "${SMTP_RELAY_PASSWORD:-}"

      # Tự động relay TẤT CẢ email nhận được
      MP_SMTP_RELAY_ALL: "true"

      # Giữ nguyên Message-ID
      MP_SMTP_RELAY_PRESERVE_MESSAGE_IDS: "false"

      # Cho phép Mailpit giữ lại email để xem trên localhost:8025
      MP_SMTP_RELAY_FWD_SMTP_ERRORS: "true"

      MP_SMTP_RELAY_OVERRIDE_FROM: "${SMTP_RELAY_USERNAME}"
      MP_SMTP_RELAY_RETURN_PATH: "${SMTP_RELAY_USERNAME}"

    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}

    container_name: restaurant-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:

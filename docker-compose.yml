services:
  db:
    image: postgres:16-alpine
    container_name: restaurant-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-restaurant_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: restaurant-backend
    restart: unless-stopped

    environment:
      PROJECT_NAME: "Restaurant Management System"

      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-restaurant_db}"

      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:5173,http://127.0.0.1:5173}
      QR_FRONTEND_URL: ${QR_FRONTEND_URL:-http://localhost:5173}

      SEED_DEMO_ACCOUNT: ${SEED_DEMO_ACCOUNT:-true}
      DEMO_USERNAME: ${DEMO_USERNAME:-manager}
      DEMO_PHONE: ${DEMO_PHONE:-0963217400}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
      DEMO_FULL_NAME: ${DEMO_FULL_NAME:-Quản lý nhà hàng}

      DB_MIGRATION_RETRIES: ${DB_MIGRATION_RETRIES:-12}
      DB_MIGRATION_RETRY_DELAY: ${DB_MIGRATION_RETRY_DELAY:-2}

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}

    container_name: restaurant-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
